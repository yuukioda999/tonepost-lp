<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お申し込みありがとうございます｜投稿確認ツール β版</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
:root{--ground:#EEF0F3;--surface:#FFFFFF;--ink:#1D2127;--sub:#5C636E;--line:#D9DDE3;--shu:#C8402A}
@media (prefers-color-scheme: dark){:root{--ground:#14171B;--surface:#1C2026;--ink:#ECEEF1;--sub:#A3AAB4;--line:#323842;--shu:#E0583F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.85;padding:24px 20px}
main{background:var(--surface);border-radius:24px;box-shadow:0 0 0 1px var(--line);padding:48px 32px;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.seal{width:96px;height:96px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);line-height:1.1}
.seal b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:26px;font-weight:900}
.seal span{font-size:11px;font-weight:700}
h1{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;font-weight:900;font-size:24px;line-height:1.5;margin:0}
p{margin:0;color:var(--sub)}
a{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<main>
  <div class="seal" aria-hidden="true"><b>受付</b><span>THANK YOU</span></div>
  <h1>お申し込みありがとうございます</h1>
  <p>内容を確認して、数日以内にメールでご連絡します。<br>使い方や今の進め方について、少しお話を聞かせてください。</p>
  <p><a href="./">ページに戻る</a></p>
</main>
</body>
</html>
